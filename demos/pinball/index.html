<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>迷你弹球台 · Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../demos.css">
<style>
.score{font-family:var(--mono);font-size:13px;margin-left:auto}
</style>
</head>
<body>
  <header class="demo-top">
    <strong>物理弹球 / 多米诺实验</strong>
    <nav><a href="../index.html">← 演示角</a></nav>
  </header>
  <main class="demo-wrap">
    <p class="lead">挡板、重力、得分——60 秒挑战。雷达 MVP 的弹球台缩小版。</p>
    <div class="demo-panel">
      <div class="demo-controls">
        <label>重力 <input type="range" id="grav" min="0.15" max="0.9" step="0.05" value="0.45"></label>
        <button type="button" id="again">再来 60s</button>
        <span class="score" id="score">得分 0 · 60s</span>
      </div>
      <canvas id="c" class="demo-canvas" width="480" height="640"></canvas>
    </div>
    <p class="demo-credit">雷达：<strong>物理弹球 / 多米诺实验</strong> · <a href="https://radar.lyihub.com/" target="_blank" rel="noopener">radar.lyihub.com</a></p>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
