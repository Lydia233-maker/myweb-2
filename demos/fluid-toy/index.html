<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebGL 流体玩具 · Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../demos.css">
</head>
<body>
  <header class="demo-top">
    <strong>WebGL 流体玩具</strong>
    <nav><a href="../index.html">← 演示角</a></nav>
  </header>
  <div class="demo-hero"><img src="../../assets/demos/fluid-toy.jpg?v=ui2" alt="" width="960" height="412"></div>
  <main class="demo-wrap">
    <p class="lead">鼠标或手指划动墨迹（2D 粒子流体近似），可换色、截图。</p>
    <div class="demo-panel">
      <div class="demo-controls">
        <label>墨色 <input type="color" id="ink" value="#2a4d6e"></label>
        <button type="button" class="ghost" id="shot">截图</button>
        <button type="button" class="ghost" id="fade">淡化</button>
      </div>
      <canvas id="c" class="demo-canvas" width="800" height="480"></canvas>
    </div>
    <p class="demo-credit">雷达：<strong>WebGL 流体玩具</strong>（本页用 Canvas 2D 轻量实现） · <a href="https://radar.lyihub.com/" target="_blank" rel="noopener">radar.lyihub.com</a></p>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
