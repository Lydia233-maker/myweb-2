<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e8ece6">
<title>Nature Portfolio · Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <section class="hero reveal">
      <p style="font-size:12px;letter-spacing:.1em;color:var(--muted)">NATURE PORTFOLIO</p>
      <h1>安静的自然系作品集排版。</h1>
      <p style="color:var(--muted);max-width:32em">大留白、柔和绿、横向滑动的项目条。适合摄影/户外品牌——此处用产品笔记主题占位。</p>
    </section>
    <section class="story reveal">
      <article class="panel"><h2 style="font-size:18px;font-weight:400;margin:0 0 8px">实地观察</h2><p style="margin:0;color:var(--muted);font-size:14px">把用户访谈当成野外笔记：先记录，再归纳。</p></article>
      <article class="panel"><h2 style="font-size:18px;font-weight:400;margin:0 0 8px">季节迭代</h2><p style="margin:0;color:var(--muted);font-size:14px">版本像节气，不必每周大改路线。</p></article>
    </section>
    <section class="reveal">
      <div class="scroll-row" tabindex="0">
        <div class="snap"><strong>Spring · 立项</strong><p style="font-size:13px;color:var(--muted)">问题够具体再写方案。</p></div>
        <div class="snap"><strong>Summer · 试点</strong><p style="font-size:13px;color:var(--muted)">小流量真环境。</p></div>
        <div class="snap"><strong>Autumn · 复盘</strong><p style="font-size:13px;color:var(--muted)">坏案例入库。</p></div>
        <div class="snap"><strong>Winter · 休整</strong><p style="font-size:13px;color:var(--muted)">少做花哨 Demo。</p></div>
      </div>
    </section>
  </div>
  <a class="back" href="../index.html">← 演示角</a>
  <script type="module" src="main.js"></script>
</body>
</html>
