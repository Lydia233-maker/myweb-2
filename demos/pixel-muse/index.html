<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Muse · Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top"><strong>Pixel Muse</strong><span style="font-size:12px">点击方块切换</span></header>
  <section class="hero reveal">
    <h1>创意格子墙</h1>
    <p style="max-width:28em;margin:12px auto 0;color:#5a5360">复古像素气质的 landing：硬边框、阶梯动效、可点的灵感块。原创图形，无外部素材。</p>
  </section>
  <section class="tiles reveal" aria-label="灵感方块">
    <button type="button" class="tile">PRD</button>
    <button type="button" class="tile">RAG</button>
    <button type="button" class="tile">Agent</button>
    <button type="button" class="tile">Eval</button>
    <button type="button" class="tile">UI</button>
    <button type="button" class="tile">Nomi</button>
  </section>
  <a class="back" href="../index.html">← 演示角</a>
  <script type="module" src="main.js"></script>
</body>
</html>
