<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>Tokyo Nocturne · Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top"><strong>Tokyo Nocturne</strong><span style="font-size:12px;color:var(--muted)">夜行主题</span></header>
  <div class="marquee" aria-hidden="true"><span>Shinjuku · Shimokitazawa · Daikanyama · product notes at 2am · lidyapm.com demos ·</span></div>
  <section class="hero reveal">
    <h1>霓虹下的城市叙事页。</h1>
    <p style="color:var(--muted);max-width:32em">横向街区卡片 + 滚动字幕。深色霓虹气质，适合活动/音乐/夜生活品牌 landing（原创配色）。</p>
  </section>
  <section class="districts reveal" tabindex="0">
    <article class="district"><h3>新宿</h3><p style="margin:0;font-size:14px;color:var(--muted)">高峰人流 = 高峰并发。先限流再优化。</p></article>
    <article class="district"><h3>下北泽</h3><p style="margin:0;font-size:14px;color:var(--muted)">小众场景里找真实需求。</p></article>
    <article class="district"><h3>代官山</h3><p style="margin:0;font-size:14px;color:var(--muted)">安静体验，别用弹窗吓人。</p></article>
    <article class="district"><h3>东京站</h3><p style="margin:0;font-size:14px;color:var(--muted)">枢纽页：一眼看懂去哪。</p></article>
  </section>
